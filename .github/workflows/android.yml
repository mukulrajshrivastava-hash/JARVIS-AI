name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file nahi mili"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "ZIP extracted successfully"

      - name: Find and Prepare Android Project
        run: |
          set -e

          FILE=$(find source -type f -path "*/app/src/main/java/com/example/jarvisai/MainActivity.kt" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt nahi mili"
            find source -name MainActivity.kt
            exit 1
          fi

          PROJECT_DIR="${FILE%/app/src/main/java/com/example/jarvisai/MainActivity.kt}"

          echo "Project found: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. source/

          FILE="source/app/src/main/java/com/example/jarvisai/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity copy nahi hui"
            exit 1
          fi

          sed -i 's/import android.app.AlarmClock/import android.provider.AlarmClock/' "$FILE"

          echo "Android project ready"

      - name: Build Android APK
        run: |
          gradle -p source assembleDebug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
