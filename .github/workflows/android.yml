name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract JARVIS Project
        run: |
          unzip -o JARVIS_AI_Secure_Starter.zip -d source

      - name: Fix AlarmClock Import
        run: |
          FILE="source/app/src/main/java/com/example/jarvisai/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "MainActivity.kt file not found!"
            exit 1
          fi

          sed -i 's/import android.app.AlarmClock/import android.provider.AlarmClock/' "$FILE"

          echo "Checking AlarmClock import:"
          grep -n "AlarmClock" "$FILE" | head -10

      - name: Build Debug APK
        run: |
          gradle -p source assembleDebug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
